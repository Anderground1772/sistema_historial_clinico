apiVersion: apps/v1
kind: Deployment
metadata:
  name: historial-clinico-frontend
  labels:
    app: historial-clinico-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: historial-clinico-frontend
  template:
    metadata:
      labels:
        app: historial-clinico-frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/PROJECT_PLACEHOLDER/historial-clinico-frontend:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: historial-clinico-frontend
spec:
  selector:
    app: historial-clinico-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: historial-clinico-frontend
spec:
  to:
    kind: Service
    name: historial-clinico-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
